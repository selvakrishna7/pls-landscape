<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient for Sunrise Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#fff8e7"/>
      <stop offset="100%" stop-color="#e8f4f8"/>
    </radialGradient>
    
    <!-- Leaf Gradients for Rich Depth -->
    <linearGradient id="stemGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#145a32"/>
      <stop offset="100%" stop-color="#27ae60"/>
    </linearGradient>
    
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2ecc71"/>
      <stop offset="100%" stop-color="#196f3d"/>
    </linearGradient>
  </defs>

  <!-- Circular Favicon Base with Soft Glow -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGlow)" stroke="#27ae60" stroke-width="2"/>

  <!-- Stem Curves -->
  <path d="M 22 50 C 22 40, 28 32, 28 26 C 28 23, 26 21, 24 20" 
        fill="none" stroke="url(#stemGrad)" stroke-width="3" stroke-linecap="round"/>
  <path d="M 27 50 C 27 42, 33 34, 32 28 C 32 25, 30 23, 29 22" 
        fill="none" stroke="url(#stemGrad)" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Swirling Leaf Arc / Canopy -->
  <g fill="url(#leafGrad)">
    <!-- Individual stylized leaves forming the top swirl -->
    <path d="M 24 20 C 26 15, 32 12, 38 14 C 42 16, 45 22, 43 27 C 40 22, 35 18, 30 19 C 27 20, 25 21, 24 20 Z"/>
    <path d="M 38 14 C 43 12, 48 16, 50 22 C 52 28, 48 35, 42 38 C 45 32, 46 25, 42 20 C 40 18, 39 16, 38 14 Z"/>
    <path d="M 42 38 C 38 42, 32 43, 28 40 C 31 38, 37 36, 40 32 C 41 34, 42 36, 42 38 Z"/>
  </g>
</svg>
